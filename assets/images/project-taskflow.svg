<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="tfBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24202D" />
      <stop offset="100%" stop-color="#191621" />
    </linearGradient>
    <filter id="tfShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24202D" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="520" rx="20" fill="#FAF9F6" />
  
  <circle cx="240" cy="180" r="150" fill="#7445C5" opacity="0.08" />
  <circle cx="560" cy="340" r="150" fill="#FF8A45" opacity="0.07" />

  <!-- Phone 1: FlowTask Dark Focus Mode -->
  <g transform="translate(140, 30)" filter="url(#tfShadow)">
    <rect width="240" height="460" rx="36" fill="#15121C" stroke="#373145" stroke-width="2" />
    
    <!-- Notch -->
    <rect x="80" y="14" width="80" height="18" rx="9" fill="#24202D" />
    
    <!-- Header -->
    <text x="24" y="66" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FAF9F6">Deep Focus</text>
    <text x="24" y="84" font-family="'DM Sans', sans-serif" font-size="11" fill="#9F98AC">Pomodoro • 25:00 min block</text>

    <!-- Circular Timer -->
    <g transform="translate(120, 175)">
      <circle cx="0" cy="0" r="62" stroke="#2D2838" stroke-width="10" fill="none" />
      <circle cx="0" cy="0" r="62" stroke="#FF8A45" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="390" stroke-dashoffset="110" transform="rotate(-90)" />
      <text x="0" y="6" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="#FAF9F6" text-anchor="middle">18:42</text>
      <text x="0" y="24" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#9F98AC" text-anchor="middle">DESIGN REVIEW</text>
    </g>

    <!-- Controls -->
    <g transform="translate(45, 265)">
      <circle cx="30" cy="20" r="18" fill="#2D2838" />
      <rect x="25" y="15" width="10" height="10" rx="2" fill="#FAF9F6" />

      <circle cx="75" cy="20" r="24" fill="#7445C5" />
      <polygon points="72,12 82,20 72,28" fill="#FAF9F6" />

      <circle cx="120" cy="20" r="18" fill="#2D2838" />
      <polygon points="115,14 125,20 115,26" fill="#FAF9F6" />
    </g>

    <!-- Quick Task Queue -->
    <g transform="translate(20, 335)">
      <rect width="200" height="50" rx="12" fill="#201C29" stroke="#363044" stroke-width="1" />
      <circle cx="22" cy="25" r="7" stroke="#0ACF83" stroke-width="2" fill="none" />
      <text x="38" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#FAF9F6">Create Wireframes</text>
      <text x="38" y="38" font-family="'DM Sans', sans-serif" font-size="9" fill="#8E879B">Figma • Completed</text>
    </g>

    <g transform="translate(20, 395)">
      <rect width="200" height="50" rx="12" fill="#201C29" stroke="#7445C5" stroke-width="1" />
      <circle cx="22" cy="25" r="7" stroke="#7445C5" stroke-width="2" fill="none" />
      <text x="38" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#FAF9F6">Interactive Prototype</text>
      <text x="38" y="38" font-family="'DM Sans', sans-serif" font-size="9" fill="#FF8A45">In Progress (18m left)</text>
    </g>
  </g>

  <!-- Phone 2: FlowTask Light Board View -->
  <g transform="translate(420, 30)" filter="url(#tfShadow)">
    <rect width="240" height="460" rx="36" fill="#FFFFFF" stroke="#E6E0F2" stroke-width="2" />
    
    <!-- Notch -->
    <rect x="80" y="14" width="80" height="18" rx="9" fill="#1C1824" />

    <text x="24" y="66" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#24202D">My Tasks</text>
    <text x="24" y="84" font-family="'DM Sans', sans-serif" font-size="11" fill="#77727F">3 active • 12 completed</text>
    <circle cx="204" cy="70" r="14" fill="#F0EEF8" />
    <text x="199" y="74" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#7445C5">+</text>

    <!-- Task List -->
    <g transform="translate(18, 105)">
      <!-- Task 1 -->
      <rect width="204" height="74" rx="14" fill="#FAF9FD" stroke="#ECE8F3" stroke-width="1.2" />
      <rect x="12" y="12" width="60" height="18" rx="9" fill="#FFEFE6" />
      <text x="19" y="24" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#FF8A45">HIGH PRIO</text>
      <text x="12" y="46" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#24202D">Design System Audit</text>
      <text x="12" y="62" font-family="'DM Sans', sans-serif" font-size="10" fill="#77727F">Color & Type Tokens</text>
    </g>

    <g transform="translate(18, 190)">
      <!-- Task 2 -->
      <rect width="204" height="74" rx="14" fill="#FAF9FD" stroke="#ECE8F3" stroke-width="1.2" />
      <rect x="12" y="12" width="65" height="18" rx="9" fill="#F0EEF8" />
      <text x="20" y="24" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#7445C5">FIGMA UI</text>
      <text x="12" y="46" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#24202D">User Flow Diagrams</text>
      <text x="12" y="62" font-family="'DM Sans', sans-serif" font-size="10" fill="#77727F">Onboarding Checkout</text>
    </g>

    <g transform="translate(18, 275)">
      <!-- Task 3 -->
      <rect width="204" height="74" rx="14" fill="#FAF9FD" stroke="#ECE8F3" stroke-width="1.2" />
      <rect x="12" y="12" width="65" height="18" rx="9" fill="#EBF9F1" />
      <text x="20" y="24" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#1B9A31">RESEARCH</text>
      <text x="12" y="46" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#24202D">Competitor Analysis</text>
      <text x="12" y="62" font-family="'DM Sans', sans-serif" font-size="10" fill="#77727F">Heuristic Evaluation</text>
    </g>

    <!-- Bottom Nav -->
    <g transform="translate(0, 410)">
      <line x1="0" y1="0" x2="240" y2="0" stroke="#EDE8F3" stroke-width="1" />
      <circle cx="48" cy="22" r="4" fill="#7445C5" />
      <circle cx="96" cy="22" r="4" fill="#A8A3B4" />
      <circle cx="144" cy="22" r="4" fill="#A8A3B4" />
      <circle cx="192" cy="22" r="4" fill="#A8A3B4" />
    </g>
  </g>
</svg>
