<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FBF9FD" />
    </linearGradient>
    <linearGradient id="ringPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7445C5" />
      <stop offset="100%" stop-color="#A259FF" />
    </linearGradient>
    <linearGradient id="ringOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A45" />
      <stop offset="100%" stop-color="#FFB380" />
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24202D" flood-opacity="0.14" />
    </filter>
    <filter id="chipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7445C5" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="520" rx="20" fill="#F4F1F9" />
  
  <!-- Subtle decorative ambient orbs -->
  <circle cx="200" cy="140" r="140" fill="#7445C5" opacity="0.08" />
  <circle cx="620" cy="380" r="160" fill="#FF8A45" opacity="0.08" />

  <!-- Phone 1: Daily Health Dashboard (Centered-Left) -->
  <g transform="translate(130, 30)" filter="url(#phoneShadow)">
    <!-- Device Body -->
    <rect width="250" height="460" rx="36" fill="#1C1824" />
    <rect x="6" y="6" width="238" height="448" rx="32" fill="url(#phoneBg)" />
    
    <!-- Dynamic Island / Notch -->
    <rect x="85" y="14" width="80" height="20" rx="10" fill="#1C1824" />
    <circle cx="150" cy="24" r="3.5" fill="#2E2838" />

    <!-- Screen Header -->
    <text x="24" y="62" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#77727F">Good morning, Fenil 👋</text>
    <text x="24" y="82" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#24202D">Daily Activity</text>
    <circle cx="214" cy="70" r="16" fill="#F0EEF8" />
    <circle cx="214" cy="68" r="6" fill="#7445C5" />

    <!-- Activity Rings Widget -->
    <g transform="translate(125, 170)">
      <!-- Outer Track & Ring (Move - Purple) -->
      <circle cx="0" cy="0" r="65" stroke="#EAE6F2" stroke-width="12" fill="none" />
      <circle cx="0" cy="0" r="65" stroke="url(#ringPurple)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="408" stroke-dashoffset="100" transform="rotate(-90)" />

      <!-- Inner Track & Ring (Calorie - Orange) -->
      <circle cx="0" cy="0" r="45" stroke="#FFEFE6" stroke-width="10" fill="none" />
      <circle cx="0" cy="0" r="45" stroke="url(#ringOrange)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="282" stroke-dashoffset="70" transform="rotate(-90)" />

      <!-- Center Metric -->
      <text x="0" y="-4" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#24202D" text-anchor="middle">84%</text>
      <text x="0" y="14" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#77727F" text-anchor="middle">GOAL REACHED</text>
    </g>

    <!-- Mini Metric Cards -->
    <g transform="translate(20, 260)">
      <rect x="0" y="0" width="100" height="66" rx="14" fill="#FAF9FC" stroke="#ECE8F3" stroke-width="1" />
      <text x="12" y="22" font-family="'DM Sans', sans-serif" font-size="10" fill="#77727F">Calories</text>
      <text x="12" y="44" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#FF8A45">780 kcal</text>
      <rect x="12" y="52" width="50" height="4" rx="2" fill="#FF8A45" />

      <rect x="108" y="0" width="100" height="66" rx="14" fill="#FAF9FC" stroke="#ECE8F3" stroke-width="1" />
      <text x="120" y="22" font-family="'DM Sans', sans-serif" font-size="10" fill="#77727F">Steps</text>
      <text x="120" y="44" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#7445C5">8,420</text>
      <rect x="120" y="52" width="60" height="4" rx="2" fill="#7445C5" />
    </g>

    <!-- Next Workout Banner -->
    <g transform="translate(20, 340)">
      <rect width="208" height="54" rx="14" fill="#7445C5" />
      <text x="16" y="24" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Core & HIIT Session</text>
      <text x="16" y="40" font-family="'DM Sans', sans-serif" font-size="10" fill="#E6DDF5">45 mins • Intermediate</text>
      <circle cx="184" cy="27" r="12" fill="#FFFFFF" opacity="0.2" />
      <polygon points="181,22 189,27 181,32" fill="#FFFFFF" />
    </g>

    <!-- Bottom Tab Bar -->
    <g transform="translate(0, 410)">
      <line x1="0" y1="0" x2="250" y2="0" stroke="#EDE8F3" stroke-width="1" />
      <circle cx="50" cy="22" r="4" fill="#7445C5" />
      <circle cx="100" cy="22" r="4" fill="#A8A3B4" />
      <circle cx="150" cy="22" r="4" fill="#A8A3B4" />
      <circle cx="200" cy="22" r="4" fill="#A8A3B4" />
    </g>
  </g>

  <!-- Phone 2: Workout Routine Screen (Overlapping Right) -->
  <g transform="translate(420, 30)" filter="url(#phoneShadow)">
    <rect width="250" height="460" rx="36" fill="#1C1824" />
    <rect x="6" y="6" width="238" height="448" rx="32" fill="url(#phoneBg)" />
    
    <!-- Dynamic Island -->
    <rect x="85" y="14" width="80" height="20" rx="10" fill="#1C1824" />

    <!-- Screen Header -->
    <text x="24" y="62" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#77727F">Explore</text>
    <text x="24" y="82" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#24202D">Daily Workouts</text>

    <!-- Category Pill Filter -->
    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="56" height="26" rx="13" fill="#7445C5" />
      <text x="14" y="17" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">All</text>

      <rect x="62" y="0" width="70" height="26" rx="13" fill="#F0EEF8" />
      <text x="74" y="17" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#7445C5">Strength</text>

      <rect x="138" y="0" width="68" height="26" rx="13" fill="#FAF9FC" />
      <text x="154" y="17" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#77727F">Cardio</text>
    </g>

    <!-- Workout Card 1 -->
    <g transform="translate(20, 142)">
      <rect width="208" height="115" rx="18" fill="#FFFFFF" stroke="#ECE8F3" stroke-width="1.2" />
      <rect x="10" y="10" width="55" height="55" rx="12" fill="#FFEFE6" />
      <circle cx="37" cy="37" r="14" fill="#FF8A45" />
      <polygon points="34,31 43,37 34,43" fill="#FFFFFF" />

      <text x="76" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#24202D">Power Yoga Flow</text>
      <text x="76" y="44" font-family="'DM Sans', sans-serif" font-size="10" fill="#77727F">Mindfulness & Flexibility</text>
      
      <line x1="12" y1="76" x2="196" y2="76" stroke="#F4F1F9" stroke-width="1" />
      
      <text x="16" y="98" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#7445C5">⏱ 30 Mins</text>
      <text x="110" y="98" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#FF8A45">🔥 220 Kcal</text>
    </g>

    <!-- Workout Card 2 -->
    <g transform="translate(20, 272)">
      <rect width="208" height="115" rx="18" fill="#FFFFFF" stroke="#ECE8F3" stroke-width="1.2" />
      <rect x="10" y="10" width="55" height="55" rx="12" fill="#F0EEF8" />
      <circle cx="37" cy="37" r="14" fill="#7445C5" />
      <polygon points="34,31 43,37 34,43" fill="#FFFFFF" />

      <text x="76" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#24202D">Full Body Blast</text>
      <text x="76" y="44" font-family="'DM Sans', sans-serif" font-size="10" fill="#77727F">Strength & Endurance</text>
      
      <line x1="12" y1="76" x2="196" y2="76" stroke="#F4F1F9" stroke-width="1" />
      
      <text x="16" y="98" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#7445C5">⏱ 45 Mins</text>
      <text x="110" y="98" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#FF8A45">🔥 450 Kcal</text>
    </g>

    <!-- Bottom Tab Bar -->
    <g transform="translate(0, 410)">
      <line x1="0" y1="0" x2="250" y2="0" stroke="#EDE8F3" stroke-width="1" />
      <circle cx="50" cy="22" r="4" fill="#A8A3B4" />
      <circle cx="100" cy="22" r="4" fill="#7445C5" />
      <circle cx="150" cy="22" r="4" fill="#A8A3B4" />
      <circle cx="200" cy="22" r="4" fill="#A8A3B4" />
    </g>
  </g>

  <!-- Floating UI Annotation Badge -->
  <g transform="translate(340, 215)" filter="url(#chipShadow)">
    <rect width="120" height="40" rx="20" fill="#FFFFFF" stroke="#7445C5" stroke-width="1.5" />
    <circle cx="20" cy="20" r="6" fill="#7445C5" />
    <text x="34" y="24" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#24202D">iOS 17 Design</text>
  </g>
</svg>
