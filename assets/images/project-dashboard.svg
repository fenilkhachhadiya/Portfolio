<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7445C5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7445C5" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="chartOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A45" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF8A45" stop-opacity="0.0" />
    </linearGradient>
    <filter id="dashShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#24202D" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Dashboard Container Window -->
  <rect width="800" height="520" rx="16" fill="#FAF9FC" />
  
  <!-- Left Navigation Sidebar -->
  <g>
    <rect width="180" height="520" rx="16" fill="#FFFFFF" />
    <line x1="180" y1="0" x2="180" y2="520" stroke="#ECE8F3" stroke-width="1" />

    <!-- App Brand -->
    <rect x="24" y="24" width="28" height="28" rx="8" fill="#7445C5" />
    <circle cx="38" cy="38" r="6" fill="#FFFFFF" />
    <text x="60" y="43" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#24202D">Nova.io</text>

    <!-- Navigation Menu Items -->
    <!-- Active Item: Overview -->
    <rect x="14" y="80" width="152" height="38" rx="10" fill="#F0EEF8" />
    <circle cx="32" cy="99" r="6" fill="#7445C5" />
    <text x="48" y="104" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#7445C5">Overview</text>

    <!-- Inactive Items -->
    <circle cx="32" cy="143" r="5" fill="#B4AFC0" />
    <text x="48" y="147" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#77727F">Analytics</text>

    <circle cx="32" cy="183" r="5" fill="#B4AFC0" />
    <text x="48" y="187" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#77727F">Customers</text>

    <circle cx="32" cy="223" r="5" fill="#B4AFC0" />
    <text x="48" y="227" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#77727F">Transactions</text>

    <circle cx="32" cy="263" r="5" fill="#B4AFC0" />
    <text x="48" y="267" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#77727F">Settings</text>

    <!-- Storage / Help Card bottom -->
    <g transform="translate(14, 420)">
      <rect width="152" height="80" rx="12" fill="#FAF9FC" stroke="#EAE6F2" stroke-width="1" />
      <text x="14" y="24" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#24202D">Design System</text>
      <text x="14" y="40" font-family="'DM Sans', sans-serif" font-size="9" fill="#77727F">Component Library v2</text>
      <rect x="14" y="52" width="124" height="18" rx="9" fill="#7445C5" />
      <text x="46" y="64" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Figma Kit</text>
    </g>
  </g>

  <!-- Top Navigation Header -->
  <g transform="translate(180, 0)">
    <rect width="620" height="64" fill="#FFFFFF" />
    <line x1="0" y1="64" x2="620" y2="64" stroke="#ECE8F3" stroke-width="1" />

    <!-- Search Bar -->
    <rect x="24" y="16" width="240" height="34" rx="17" fill="#FAF9FC" stroke="#ECE8F3" stroke-width="1" />
    <circle cx="42" cy="33" r="5" stroke="#77727F" stroke-width="1.5" fill="none" />
    <text x="56" y="37" font-family="'DM Sans', sans-serif" font-size="11" fill="#9C95AA">Search metrics, orders...</text>

    <!-- Right Actions -->
    <circle cx="510" cy="33" r="15" fill="#FAF9FC" stroke="#ECE8F3" stroke-width="1" />
    <circle cx="514" cy="27" r="3" fill="#FF8A45" />

    <!-- User Profile Chip -->
    <circle cx="560" cy="33" r="16" fill="#E6DDF5" />
    <text x="555" y="38" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#7445C5">FK</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(204, 80)">
    <!-- KPI Summary Row (3 Cards) -->
    <!-- Card 1: Total Revenue -->
    <g filter="url(#dashShadow)">
      <rect width="180" height="84" rx="14" fill="#FFFFFF" stroke="#ECE8F3" stroke-width="1" />
      <text x="16" y="24" font-family="'DM Sans', sans-serif" font-size="11" fill="#77727F">Total Revenue</text>
      <text x="16" y="52" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#24202D">$124,850</text>
      <rect x="16" y="60" width="56" height="16" rx="8" fill="#EBF9F1" />
      <text x="23" y="72" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#1B9A31">+18.2%</text>
    </g>

    <!-- Card 2: Active Users -->
    <g transform="translate(196, 0)" filter="url(#dashShadow)">
      <rect width="180" height="84" rx="14" fill="#FFFFFF" stroke="#ECE8F3" stroke-width="1" />
      <text x="16" y="24" font-family="'DM Sans', sans-serif" font-size="11" fill="#77727F">Active Users</text>
      <text x="16" y="52" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#24202D">18,420</text>
      <rect x="16" y="60" width="56" height="16" rx="8" fill="#EBF9F1" />
      <text x="23" y="72" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#1B9A31">+8.4%</text>
    </g>

    <!-- Card 3: Avg Conversion -->
    <g transform="translate(392, 0)" filter="url(#dashShadow)">
      <rect width="180" height="84" rx="14" fill="#FFFFFF" stroke="#ECE8F3" stroke-width="1" />
      <text x="16" y="24" font-family="'DM Sans', sans-serif" font-size="11" fill="#77727F">Conversion Rate</text>
      <text x="16" y="52" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#7445C5">4.85%</text>
      <rect x="16" y="60" width="56" height="16" rx="8" fill="#FFEFE6" />
      <text x="24" y="72" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#FF8A45">+3.1%</text>
    </g>

    <!-- Big Revenue Analytics Chart Card -->
    <g transform="translate(0, 100)" filter="url(#dashShadow)">
      <rect width="572" height="180" rx="14" fill="#FFFFFF" stroke="#ECE8F3" stroke-width="1" />
      <text x="20" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#24202D">Revenue & Growth Analytics</text>
      
      <!-- Timeframe pill -->
      <rect x="475" y="14" width="76" height="22" rx="11" fill="#F0EEF8" />
      <text x="487" y="29" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#7445C5">Last 30 Days</text>

      <!-- Chart Grid lines -->
      <line x1="20" y1="65" x2="550" y2="65" stroke="#F4F1F9" stroke-width="1" />
      <line x1="20" y1="105" x2="550" y2="105" stroke="#F4F1F9" stroke-width="1" />
      <line x1="20" y1="145" x2="550" y2="145" stroke="#F4F1F9" stroke-width="1" />

      <!-- Area Chart Gradient Fill -->
      <path d="M30,145 Q80,120 130,135 T230,95 T330,105 T430,60 T540,75 L540,165 L30,165 Z" fill="url(#chartGrad)" />
      
      <!-- Curved Stroke Line -->
      <path d="M30,145 Q80,120 130,135 T230,95 T330,105 T430,60 T540,75" stroke="#7445C5" stroke-width="3" fill="none" stroke-linecap="round" />

      <!-- Orange Secondary Curve -->
      <path d="M30,155 Q80,145 130,150 T230,125 T330,130 T430,100 T540,110" stroke="#FF8A45" stroke-width="2" stroke-dasharray="4 3" fill="none" />

      <!-- Interactive Data Point -->
      <circle cx="430" cy="60" r="5" fill="#7445C5" stroke="#FFFFFF" stroke-width="2" />
      <rect x="400" y="32" width="60" height="20" rx="6" fill="#24202D" />
      <text x="410" y="46" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">$9,420</text>
    </g>

    <!-- Mini Transactions Table -->
    <g transform="translate(0, 295)" filter="url(#dashShadow)">
      <rect width="572" height="120" rx="14" fill="#FFFFFF" stroke="#ECE8F3" stroke-width="1" />
      <text x="20" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#24202D">Recent User Activity</text>

      <!-- Row 1 -->
      <circle cx="32" cy="54" r="10" fill="#F0EEF8" />
      <text x="50" y="58" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#24202D">SaaS Pro Plan Subscription</text>
      <rect x="360" y="44" width="60" height="18" rx="9" fill="#EBF9F1" />
      <text x="372" y="56" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#1B9A31">Completed</text>
      <text x="500" y="58" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#24202D">+$290.00</text>

      <line x1="20" y1="72" x2="550" y2="72" stroke="#F4F1F9" stroke-width="1" />

      <!-- Row 2 -->
      <circle cx="32" cy="94" r="10" fill="#FFEFE6" />
      <text x="50" y="98" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#24202D">Annual Enterprise License</text>
      <rect x="360" y="84" width="60" height="18" rx="9" fill="#EBF9F1" />
      <text x="372" y="96" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#1B9A31">Completed</text>
      <text x="492" y="98" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#7445C5">+$1,450.00</text>
    </g>
  </g>
</svg>
