<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7FAF8" />
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D7A56" />
      <stop offset="100%" stop-color="#1F583D" />
    </linearGradient>
    <filter id="ecoShadow" x="-5%" y="-5%" width="112%" height="112%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#24202D" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="800" height="520" rx="20" fill="#FAF9F6" />
  
  <!-- Browser Chrome Top Bar -->
  <rect x="0" y="0" width="800" height="46" rx="20" fill="#FFFFFF" />
  <rect x="0" y="24" width="800" height="22" fill="#FFFFFF" />
  <line x1="0" y1="46" x2="800" y2="46" stroke="#ECE8F3" stroke-width="1.2" />
  
  <circle cx="28" cy="23" r="5" fill="#FF5F56" />
  <circle cx="46" cy="23" r="5" fill="#FFBD2E" />
  <circle cx="64" cy="23" r="5" fill="#27C93F" />
  
  <rect x="220" y="10" width="360" height="26" rx="13" fill="#F4F1F9" stroke="#E3DEF0" stroke-width="1" />
  <text x="240" y="27" font-family="'DM Sans', sans-serif" font-size="11" fill="#77727F">https://ecosphere.store/sustainable-living</text>

  <!-- Store Header -->
  <g transform="translate(48, 64)">
    <circle cx="14" cy="14" r="14" fill="#2D7A56" />
    <path d="M14,6 C10,12 8,16 14,21 C20,16 18,12 14,6 Z" fill="#FFFFFF" />
    <text x="36" y="20" font-family="'Outfit', sans-serif" font-size="17" font-weight="800" fill="#24202D">EcoSphere</text>

    <!-- Nav -->
    <text x="260" y="19" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#24202D">Shop All</text>
    <text x="340" y="19" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#77727F">Zero Waste</text>
    <text x="440" y="19" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#77727F">Our Story</text>
    
    <rect x="620" y="0" width="84" height="30" rx="15" fill="#7445C5" />
    <text x="640" y="19" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Cart (3)</text>
  </g>

  <!-- Hero Section -->
  <g transform="translate(48, 120)">
    <text x="0" y="36" font-family="'Outfit', sans-serif" font-size="32" font-weight="800" fill="#24202D">
      Designed for Earth, Crafted for Daily Life.
    </text>
    <text x="0" y="65" font-family="'DM Sans', sans-serif" font-size="14" fill="#77727F">
      A minimalist e-commerce interface focusing on high conversion, clear product hierarchies, and eco-transparency.
    </text>
  </g>

  <!-- 3 Product Cards Grid -->
  <g transform="translate(48, 210)">
    <!-- Card 1 -->
    <g filter="url(#ecoShadow)">
      <rect width="220" height="270" rx="18" fill="#FFFFFF" stroke="#ECE8F3" stroke-width="1.2" />
      <rect x="12" y="12" width="196" height="150" rx="12" fill="#F4F8F5" />
      <circle cx="110" cy="85" r="45" fill="#E2EFE7" />
      <!-- Reusable Bottle Graphic -->
      <rect x="96" y="52" width="28" height="66" rx="8" fill="#2D7A56" />
      <rect x="102" y="44" width="16" height="8" rx="2" fill="#FF8A45" />

      <text x="18" y="186" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#24202D">Matte Steel Flask</text>
      <text x="18" y="204" font-family="'DM Sans', sans-serif" font-size="11" fill="#77727F">100% Recycled • 750ml</text>
      <text x="18" y="244" font-family="'Outfit', sans-serif" font-size="17" font-weight="800" fill="#7445C5">$34.00</text>
      <rect x="156" y="222" width="48" height="32" rx="16" fill="#24202D" />
      <text x="176" y="242" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">+</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(242, 0)" filter="url(#ecoShadow)">
      <rect width="220" height="270" rx="18" fill="#FFFFFF" stroke="#ECE8F3" stroke-width="1.2" />
      <rect x="12" y="12" width="196" height="150" rx="12" fill="#FFF8F4" />
      <circle cx="110" cy="85" r="45" fill="#FFEAE0" />
      <!-- Organic Ceramic Mug -->
      <ellipse cx="110" cy="90" rx="32" ry="24" fill="#FF8A45" />
      <rect x="88" y="66" width="44" height="24" rx="4" fill="#FF8A45" />

      <text x="18" y="186" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#24202D">Artisan Coffee Cup</text>
      <text x="18" y="204" font-family="'DM Sans', sans-serif" font-size="11" fill="#77727F">Handmade Stoneware</text>
      <text x="18" y="244" font-family="'Outfit', sans-serif" font-size="17" font-weight="800" fill="#7445C5">$26.00</text>
      <rect x="156" y="222" width="48" height="32" rx="16" fill="#24202D" />
      <text x="176" y="242" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">+</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(484, 0)" filter="url(#ecoShadow)">
      <rect width="220" height="270" rx="18" fill="#FFFFFF" stroke="#ECE8F3" stroke-width="1.2" />
      <rect x="12" y="12" width="196" height="150" rx="12" fill="#F6F3FC" />
      <circle cx="110" cy="85" r="45" fill="#EAE2F7" />
      <!-- Linen Tote Graphic -->
      <rect x="85" y="65" width="50" height="42" rx="6" fill="#7445C5" />
      <path d="M96,65 C96,52 124,52 124,65" stroke="#FF8A45" stroke-width="3" fill="none" />

      <text x="18" y="186" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#24202D">Organic Canvas Tote</text>
      <text x="18" y="204" font-family="'DM Sans', sans-serif" font-size="11" fill="#77727F">Unbleached Hemp Fiber</text>
      <text x="18" y="244" font-family="'Outfit', sans-serif" font-size="17" font-weight="800" fill="#7445C5">$19.50</text>
      <rect x="156" y="222" width="48" height="32" rx="16" fill="#24202D" />
      <text x="176" y="242" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">+</text>
    </g>
  </g>
</svg>
