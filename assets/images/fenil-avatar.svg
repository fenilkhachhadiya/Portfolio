<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EEFA" />
      <stop offset="50%" stop-color="#FAF9F6" />
      <stop offset="100%" stop-color="#FFEFE6" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7445C5" />
      <stop offset="100%" stop-color="#552B9E" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A45" />
      <stop offset="100%" stop-color="#F36718" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7445C5" flood-opacity="0.14" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#24202D" flood-opacity="0.08" />
    </filter>
    <clipPath id="avatarClip">
      <circle cx="270" cy="275" r="160" />
    </clipPath>
  </defs>

  <!-- Ambient Backdrop Circles -->
  <circle cx="270" cy="275" r="210" fill="#7445C5" opacity="0.04" />
  <circle cx="270" cy="275" r="185" fill="#FF8A45" opacity="0.05" />

  <!-- Main Profile Card Frame -->
  <rect x="70" y="75" width="400" height="420" rx="36" fill="url(#bgGrad)" stroke="#EAE6F2" stroke-width="2" filter="url(#cardShadow)" />

  <!-- Decorative Figma Grid lines inside card -->
  <g opacity="0.12" stroke="#7445C5" stroke-dasharray="3 3">
    <line x1="110" y1="90" x2="110" y2="480" />
    <line x1="270" y1="90" x2="270" y2="480" />
    <line x1="430" y1="90" x2="430" y2="480" />
    <line x1="80" y1="210" x2="460" y2="210" />
    <line x1="80" y1="360" x2="460" y2="360" />
  </g>

  <!-- Avatar Base Circle -->
  <g clip-path="url(#avatarClip)">
    <rect x="110" y="115" width="320" height="320" fill="#E8E2F5" />
    <circle cx="270" cy="300" r="140" fill="#D9D0ED" />

    <!-- Stylized Modern Designer Portrait (Fenil) -->
    <!-- Torso / Dark Blazer & White Shirt -->
    <path d="M170,430 L370,430 C370,360 340,320 270,320 C200,320 170,360 170,430 Z" fill="#24202D" />
    <!-- White Collared Shirt -->
    <polygon points="270,320 250,375 270,395 290,375" fill="#FAF9F6" />
    <polygon points="250,375 270,325 240,335" fill="#EDE9F3" />
    <polygon points="290,375 270,325 300,335" fill="#EDE9F3" />
    <!-- Neck -->
    <rect x="252" y="270" width="36" height="58" rx="8" fill="#E8B48F" />
    <!-- Face Shadow under chin -->
    <ellipse cx="270" cy="275" rx="22" ry="10" fill="#D89A74" opacity="0.5" />
    
    <!-- Face Base -->
    <ellipse cx="270" cy="235" rx="52" ry="60" fill="#F0C3A0" />
    <!-- Ears -->
    <circle cx="216" cy="240" r="12" fill="#E8B48F" />
    <circle cx="324" cy="240" r="12" fill="#E8B48F" />
    
    <!-- Hair (Modern styled side-part dark hair) -->
    <path d="M214,225 C214,170 240,162 270,162 C315,162 328,185 328,225 C328,205 315,185 270,188 C235,190 220,205 214,225 Z" fill="#1C1824" />
    <path d="M216,215 C218,175 250,165 285,168 C320,171 332,192 330,225 C324,200 300,185 270,185 C235,185 220,200 216,215 Z" fill="#24202D" />
    
    <!-- Eyes -->
    <ellipse cx="250" cy="232" rx="4.5" ry="5.5" fill="#24202D" />
    <ellipse cx="290" cy="232" rx="4.5" ry="5.5" fill="#24202D" />
    <circle cx="251" cy="230" r="1.5" fill="#FFFFFF" />
    <circle cx="291" cy="230" r="1.5" fill="#FFFFFF" />
    
    <!-- Eyebrows -->
    <path d="M240,220 Q252,216 262,221" stroke="#24202D" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M278,221 Q288,216 300,220" stroke="#24202D" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Nose -->
    <path d="M270,230 L267,246 L273,247" stroke="#D89A74" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Warm Confident Smile -->
    <path d="M256,260 Q270,272 284,260" stroke="#873531" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M260,261 Q270,268 280,261" fill="#FFFFFF" opacity="0.9" />

    <!-- Subtle Mustache / Neat Grooming -->
    <path d="M262,253 Q270,256 278,253" stroke="#24202D" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Inner Circle Border -->
  <circle cx="270" cy="275" r="160" fill="none" stroke="#7445C5" stroke-width="3" opacity="0.25" />

  <!-- Floating Badge 1: Figma Tool Badge (Top Left) -->
  <g transform="translate(40, 130)" filter="url(#badgeShadow)">
    <rect width="135" height="48" rx="24" fill="#FFFFFF" stroke="#E6E0F2" stroke-width="1.5" />
    <!-- Figma Icon graphic -->
    <g transform="translate(14, 10)">
      <rect x="0" y="0" width="8" height="8" rx="4" fill="#F24E1E" />
      <rect x="8" y="0" width="8" height="8" rx="4" fill="#FF7262" />
      <rect x="0" y="8" width="8" height="8" rx="4" fill="#A259FF" />
      <circle cx="12" cy="12" r="4" fill="#1ABCFE" />
      <rect x="0" y="16" width="8" height="8" rx="4" fill="#0ACF83" />
    </g>
    <text x="44" y="29" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#24202D">Figma UI/UX</text>
  </g>

  <!-- Floating Badge 2: Cursor & Name Tag (Bottom Left) -->
  <g transform="translate(35, 410)" filter="url(#badgeShadow)">
    <!-- Designer cursor -->
    <polygon points="12,4 12,24 18,19 23,28 27,26 22,17 29,17" fill="#7445C5" />
    <rect x="30" y="6" width="130" height="34" rx="8" fill="#7445C5" />
    <text x="42" y="28" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Fenil (Designing...)</text>
  </g>

  <!-- Floating Badge 3: Design Skills Chip (Top Right) -->
  <g transform="translate(370, 120)" filter="url(#badgeShadow)">
    <rect width="130" height="46" rx="23" fill="#FFFFFF" stroke="#FFE3D4" stroke-width="1.5" />
    <circle cx="24" cy="23" r="10" fill="#FF8A45" />
    <polygon points="21,23 23,25 28,19" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="42" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#24202D">User-Centric</text>
  </g>

  <!-- Floating Badge 4: Color Swatches & Auto-Layout (Bottom Right) -->
  <g transform="translate(375, 385)" filter="url(#badgeShadow)">
    <rect width="135" height="54" rx="16" fill="#FFFFFF" stroke="#E6E0F2" stroke-width="1.5" />
    <text x="14" y="22" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#77727F">AUTO LAYOUT</text>
    <!-- Color dots -->
    <circle cx="22" cy="38" r="7" fill="#7445C5" />
    <circle cx="42" cy="38" r="7" fill="#FF8A45" />
    <circle cx="62" cy="38" r="7" fill="#24202D" />
    <rect x="80" y="31" width="42" height="15" rx="7.5" fill="#F0EEF8" />
    <text x="88" y="42" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#7445C5">Hug 16</text>
  </g>
</svg>
